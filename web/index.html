<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>冲浪者 · 缠论走图</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <!-- 牌子跟两个下拉装**一行**里（.bline）。为什么不直接让 .bar 自己排：.bar 是 wrap 的，
       换行**先于**收缩发生 —— 只要两样的基准宽加起来过不去，第二个就整块折到下一行，
       再怎么 min-width:0 也不会回同一行。包一层 nowrap，它们才真的会**一起被压窄**。
       手机上去掉牌子后半句域名之后（见 style.css），390 上本来就同得下，360 上也压得下。 -->
  <div class="bline">
    <div class="brand">冲浪者 · 缠论<span class="sub">chanlun.surfers.cc</span></div>
    <div class="picks">
      <label class="pick"><span>品种</span><select id="symbol" aria-label="品种"></select></label>
      <label class="pick"><span>周期</span><select id="tf" aria-label="周期"></select></label>
    </div>
  </div>
  <div class="badges">
    <span id="last" class="badge"></span>
    <span id="state" class="badge">取数…</span>
    <!-- ★ 这里的 title 只在**数据落地之前**露脸（一有 data，stamp() 就把它整句换掉，见 app.js）。
         所以它写的是口径、不是某个时刻：本地时区那几个字必须对 —— 原来是「（UTC）」。 -->
    <span id="updated" class="badge" title="最后一根 K 线的开盘时间（按你机器的本地时区）">—</span>
  </div>
</header>

<main>
  <div id="chart" role="img" aria-label="缠论结构图：K线、笔、线段、中枢、买卖点">
    <!-- 图上那两块浮层装**一个竖排盒子**里（card-4cdf628c-c84 加的读数块排在后面）：
         ① 两块同时在的时候不许叠 —— 谁也不用去量谁多高，盒子自己就排开了；
         ② 盒子整体 pointer-events:none：浮层不许把拖拽/缩放吃掉（跟 .more 同一条账）。
         盒子放在 #chart **里面**：#chart 是 position:relative，它就永远只横跨图那一栏 ——
         放到 main 下面的话，桌面端的 right:10px 会越过图层栏去（190px 那个数就得再抄一遍）。 -->
    <div class="overlays">
      <!-- 换档之后那句话（可视窗口里的结构真变了才出，3 秒自己淡掉） -->
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <!-- 光标读数：十字线停在哪一根，就把那一根摊开（开高低收 ＋ 涨跌幅）。
           时刻／数字／精度都不是这儿算的 —— 图上那一刻怎么念、价怎么印，各有**一处**出处（app.js 里那一节）。 -->
      <div id="readout" class="readout">
        <div class="rt" id="ro-time"></div>
        <div class="ro">
          <span class="rv"><i>开</i><b id="ro-open"></b></span>
          <span class="rv"><i>高</i><b id="ro-high"></b></span>
          <span class="rv"><i>低</i><b id="ro-low"></b></span>
          <span class="rv"><i>收</i><b id="ro-close"></b></span>
        </div>
        <!-- 药丸**单独一个孩子**（不在 .ro 里）：宽屏上它排在四个数后面（读作"收…涨跌幅…"），
             窄屏上挪到时刻那一行（那边空着，见 style.css 窄屏那档）—— 一个元素两种排法，
             不用两套 DOM。 -->
        <span class="pct" id="ro-pct"></span>
      </div>
      <!-- 副图那一格的头（卡 card-68704ee6-a5a）：口径照 /api/macd 回的那份念（params ＋ hist_def），
           悬停时后面跟上那一根的三个数 —— 跟主图的读数**同一个十字线**、同一条回调。
           跟读数块放同一个盒子里：它也是浮在画布上的（pointer-events:none 同一个账），
           位置由 app.js 按副图窗格的高度算（窗格高度是 LWC 排的，不是 CSS 摆的）。
           ★ 为什么自己摆 DOM 而不让 LWC 画：series 的 title 在 5.2.1 里**根本不画**（2026-10-04 实拍验过）。 -->
      <div id="subhead" class="subhead"></div>
      <!-- 「消失的点」那个数（卡 card-cf3ed018-795）。★ 为什么**不挂图脚**：图脚是流内布局，
           这一格一出来就把 #chart 挤矮。1440 实量：图脚本行已经占 1344/1412 px，多这 42 个字
           就折行 ⇒ foot 60→77、#chart 760→743，**整张图当场往下挪 3 px**（消失的点一出现图就跳，
           而这正是这一卡要人看见的那一刻）。窄屏那一档更糟：`.foot` 整个 `display:none`
           （body.m-fold），手机上这个数根本不存在。
           挂进这个浮层盒子：绝对定位、不占位，图的尺寸一个字都不动，宽窄屏都在。 -->
      <div id="ghostc" class="ghostc" role="status" aria-live="polite">
        <!-- 记号本尊的小样：**形状**挂在这儿，不挂图例。
             ★ 为什么不进图例（2026-10-05 实量的账）：图例那一行在 1280 宽下已经排满，再加一格就
               **折行** —— legend 32→54px，#chart 660→637px，整幅图矮 23px（`tools/web_readout_e2e.js`
               的 ㉑ 那一格当场红：它按图底的 40px 处点指针，图一矮，那一点就落到时间轴上去了）。
               这一格是"出了事才出现"的，凭什么常驻着占图的高度。
             ★ 而且图例在窄屏那一档是 `display:none`（body.m-fold），手机上根本看不见 ——
               记号却会长在手机上。挂在这一格里，图和数一起出现，手机上也认得出。
             色用 currentColor（跟着这一格的正文色走），**不**画成红或绿：这一格说的是形状，
             不是方向 —— 图上那个记号是红是绿取决于它当初是个买点还是卖点，样例不该替用户认一个。 -->
        <svg class="gs" width="15" height="13" viewBox="0 0 15 13" aria-hidden="true">
          <polygon points="7.5,1 1,11.5 14,11.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <line x1="0.5" y1="12.5" x2="14.5" y2="0.5" stroke="currentColor" stroke-width="1.4"/>
        </svg><span id="ghostc-tx"></span>
      </div>
    </div>
    <!-- 全屏那颗按钮（卡 card-5014b0cb-e4d）。挂在 #chart 里、**不在 .overlays 里**：
         那个盒子整块 pointer-events:none（浮层不许吃拖拽），按钮得能点 ⇒ 它是 #chart 的另一个孩子。
         位置由 style.css 摆（right 让开右轴那一条，宽度问图自己要，见 .fs 那段注释）。
         两副箭头＝两个含义，靠 body.fs-on 换（不是把一颗按钮改成另一颗）：朝外＝进全屏，朝里＝退全屏。 -->
    <button id="fs" class="fs" type="button" aria-pressed="false" aria-label="全屏看图" title="全屏看图（Esc 退出）">
      <svg class="fs-out" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M1.6 6.4V1.6h4.8M14.4 6.4V1.6h-4.8M1.6 9.6v4.8h4.8M14.4 9.6v4.8h-4.8"/>
      </svg>
      <svg class="fs-in" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M6.4 1.6v4.8H1.6M9.6 1.6v4.8h4.8M6.4 14.4v-4.8H1.6M9.6 14.4v-4.8h4.8"/>
      </svg>
    </button>
  </div>
  <!-- 往左拖要更早 K 线时的话（加载中 / 已到最早）。挂在图上、不塞顶栏：用户在图左边做动作，话就说在他眼睛在的地方 -->
  <div id="more" class="more" role="status" aria-live="polite"></div>
  <aside id="panel" class="panel" aria-label="图层开关"></aside>
  <!-- 手机上的「图例 / 数据 / 约定」收起开关（卡 card-b9792318-91d，小栋 2026-10-04 定 ②B）。
       桌面**不显示这一颗**（style.css 里 display:none，那两条 CSS 只在窄屏那一档里认 body.m-fold）。
       ★ 2026-10-04 挪进 main（卡 card-c7f19e45-022）：原先它排在 main 后面，是 body 的一格，
         **自己占一整行 29.5px** —— 那一行是从图上抠的（844 的屏，图那栏只有 660）。挪进来挂在
         main 里、窄屏那一档把它**钉在图层条右端**（不是插进 13 颗 chip 里跟着横滑），
         图那栏就把这 29.5px 拿回来了；徽标一个字没动。
       为什么是"收起"而不是"挪走"：图例（学一次）和约定（读一次）是**参考**，元信息是**诊断** ——
       三者都不是看盘时要盯的东西，但也不能删（小栋 05:00Z 的原话是「默认收起，点一下展开」）。 -->
  <button id="fold" class="fold" type="button" aria-expanded="false">
    <span id="fold-tx">图例 · 数据 · 约定</span><span class="chev" aria-hidden="true">▾</span>
  </button>
</main>

<div id="legend" class="legend" aria-label="图例"></div>

<footer class="foot">
  <span id="meta" class="meta"></span>
  <span class="sign">约定：未完成的笔 / 线段一律虚线；中枢框拆两截，前三实线、延续虚线 ｜ 冲浪者 · <b id="today"></b></span>
</footer>

<script src="vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
